<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Wishlist</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container my-5">
        <h2 class="text-center mb-4">Your Wishlist</h2>

        {% if wishlist_items %}
        <div class="row">
            {% for item_id, item_type, image_path in wishlist_items %}
            <div class="col-md-3 mb-4">
                <div class="card h-100 text-center">
                    <img src="{{ image_path }}" class="card-img-top" alt="{{ item_type }}" style="height: 250px; object-fit: cover;">
                    <div class="card-body">
                        <h5 class="card-title">{{ item_type }}</h5>
                        <form method="POST" action="{{ url_for('remove_from_wishlist', item_id=item_id) }}">
                            <button type="submit" class="btn btn-danger btn-sm">Remove</button>
                        </form>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
        {% else %}
            <p class="text-center">You haven't added any items to your wishlist yet.</p>
        {% endif %}

        <div class="text-center mt-4">
            <a href="{{ url_for('index') }}" class="btn btn-primary">Back to Closet</a>
        </div>
    </div>
</body>
</html>
